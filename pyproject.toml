[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conso-hdf-mlops"
version = "0.1.0"
description = "Prévision de la consommation électrique des Hauts-de-France – projet MLOps"
# Testé en 3.11 (CI, Docker). Python 3.13+ : certaines dépendances (mlflow, evidently) peuvent manquer de wheels.
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
