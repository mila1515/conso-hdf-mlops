name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Installer les dépendances (versions figées)
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Vérifier que requirements.lock est à jour
        run: |
          pip install uv
          cp requirements.lock /tmp/requirements.lock  # uv garde les versions existantes si elles restent valides
          uv pip compile requirements.txt --python-version 3.11 --python-platform linux -q -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)             || (echo "requirements.lock n'est plus à jour : lancez 'make lock'" && exit 1)
      - name: Lint (ruff)
        run: ruff check src tests dashboard
      - name: Tests (pytest)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t conso-hdf-api .
